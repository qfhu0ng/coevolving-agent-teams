[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-company"
version = "0.1.0"
description = "Evolving the coordination strategy of a multi-agent coding team on ProgramBench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["aiohttp>=3.11,<4", "pyyaml>=6"]

[project.optional-dependencies]
programbench = ["programbench==1.2.4"]
dev = [
    "pytest>=7.4",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["agent_company*"]

[tool.setuptools.package-data]
agent_company = [
    "roadmap/policies/*.md",
    "runtime/*.cjs",
    "runtime/*.mjs",
    "runtime/network_helper.Dockerfile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "external",
    "runs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["agent_company"]
